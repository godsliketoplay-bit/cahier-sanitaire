function load(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x===null?clone(d):x}catch(e){return clone(d)}}function clone(x){return JSON.parse(JSON.stringify(x))}function save(){localStorage.setItem(CFG,JSON.stringify(config));localStorage.setItem(KEY,JSON.stringify(records))}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function localISO(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function actualToday(){return localISO(new Date())}function today(){return config.workDate||actualToday()}function now(){var real=new Date(),base=new Date(today()+'T00:00:00');base.setHours(real.getHours(),real.getMinutes(),real.getSeconds(),real.getMilliseconds());return {iso:today(),date:base.toLocaleDateString('fr-FR'),time:base.toLocaleTimeString('fr-FR'),stamp:real.toISOString()}}function setWorkDate(v){if(!v)return;config.workDate=v;save();home()}function isClosedDate(d){var dt=new Date(d+'T12:00:00'),wd=dt.getDay(),sc=config.schedule||{};return (sc.weekdays||[]).indexOf(wd)<0||(sc.closures||[]).indexOf(d)>=0||(sc.holidays||[]).indexOf(d)>=0}function workHoursLabel(){var h=config.scheduleHours||{};return h.enabled&&h.start&&h.end?' · Horaires : '+h.start+'–'+h.end:''} function mod(k){if(k==='menu_control')return ['menu_control','🍽️','Contrôle lié au menu','daily'];if(k==='menu_stage')return ['menu_stage','🍳','Étapes cuisson / maintien / service','daily'];if(k==='cleaning_session'||k==='cleaning_task')return [k,'🧽','Nettoyage / désinfection','daily'];if(k==='daily_tick')return ['daily_tick','☑️','Contrôles quotidiens','daily'];if(k==='menu_served')return ['menu_served','🍽️','Menu effectivement servi','daily'];return modules.find(function(m){return m[0]===k})||[k,'📋','Enregistrement','daily']}function page(title,body){var backFn=window._returnPage||home;window._returnPa function cleaningDueToday(task){
var d=today(),dt=new Date(d+'T12:00:00'),wd=dt.getDay();
if(!task.active)return false;
if(task.startDate&&d<task.startDate)return false;
if(task.endDate&&d>task.endDate)return false;
var freq=task.frequency||'daily';
if(freq==='daily')return true;
if(freq==='weekly')return (task.weekdays||[]).indexOf(wd)>=0;
if(freq==='biweekly'){
  if((task.weekdays||[]).indexOf(wd)<0)return false;
  var base=task.startDate||d,bd=new Date(base+'T12:00:00'),diff=Math.floor((dt-bd)/86400000);
  return diff>=0 && Math.floor(diff/7)%2===0;
}
if(freq==='monthly')return dt.getDate()===Number(task.dayOfMonth||1);
if(freq==='interval'){
  var base2=task.startDate||d,bd2=new Date(base2+'T12:00:00'),diff2=Math.floor((dt-bd2)/86400000),n=Number(task.intervalDays||14);
  return diff2>=0 && diff2%n===0;
}
return false;
}

function downloadBlob(blob,name){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);try{a.click()}finally{setTimeout(function(){a.remove();URL.revokeObjectURL(url)},1500)}}

function restoreBackup(){var el=document.getElementById('restore'),f=el&&el.files&&el.files[0];if(!f){alert('Sélectionnez un fichier .json de sauvegarde.');return}var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!x.config||!Array.isArray(x.records))throw Error('invalid');if(!confirm('Restaurer cette sauvegarde remplacera les données actuellement présentes sur cet appareil. Continuer ?'))return;config=x.config;records=x.records;if(!config.ingredients)config.ingredients=[];if(!config.traceLots)config.traceLots=[];save();alert('✓ Sauvegarde restaurée.');home()}catch(e){alert('Sauvegarde invalide ou incomplète.')}};r.readAsText(f)}
function backupPage(){window._returnPage=function(){home()};page('💾 Sauvegarde','<div class="notice"><b>Fichier complet .json</b><br>La sauvegarde contient les paramètres, les enregistrements, les corrections et les pièces jointes/photos conservées dans l’application.</div><button type="button" class="save" onclick="saveBackupToPhone()">💾 Enregistrer la sauvegarde</button><hr><label>♻️ Restaurer une sauvegarde</label><input id="restore" type="file" accept="application/json,.json"><button type="button" class="secondary" onclick="restoreBackup()">♻️ Restaurer</button>')}
function correctionHistory(){window._returnPage=function(){home()};var rows=[];records.forEach(function(r){(r.corrections||[]).forEach(function(c,i){rows.push({r:r,c:c,i:i})})});rows.sort(function(a,b){return String(b.c.timestamp||'').localeCompare(String(a.c.timestamp||''))});var h='<div class="notice"><b>Historique des corrections</b><br>Les valeurs d’origine restent conservées. Chaque correction indique le champ, l’ancienne valeur, la nouvelle valeur, le motif et la date.</div>';if(!rows.length)h+='<div class="muted">Aucune correction enregistrée.</div>';rows.forEach(function(x){h+='<div class="record"><b>'+esc(friendlyModule(x.r.module))+'</b><div class="muted">'+esc(x.c.date||'')+' · '+esc(x.c.time||'')+(x.c.operator?' · '+esc(x.c.operator):'')+'</div><div class="rule"><b>'+esc(friendlyField(x.c.field))+'</b><br>Avant : '+esc(typeof x.c.oldValue==='string'?x.c.oldValue:JSON.stringify(x.c.oldValue))+'<br>Après : '+esc(typeof x.c.newValue==='string'?x.c.newValue:JSON.stringify(x.c.newValue))+'<br><b>Motif :</b> '+esc(x.c.reason||'')+'</div><div class="record-actions"><button type="button" class="smallbtn" onclick="viewRecord(\''+esc(x.r.id)+'\')">👁 Voir l’enregistrement</button></div></div>'});page('✏️ Corrections',h)}
function exportReportHTML(){var list=records.slice().sort(function(a,b){return b.createdAt.localeCompare(a.createdAt)}),rows='';list.forEach(function(r){var vals=Object.keys(r.data||{}).filter(function(k){return ['taskId','menuIndex','stepIndex','stepId','haccpStage'].indexOf(k)<0}).map(function(k){return '<div><b>'+esc(friendlyField(k))+'</b> : '+esc(excelSafe(r.data[k]))+'</div>'}).join('');rows+='<section><h2>'+esc(friendlyModule(r.module))+'</h2><div class="meta">'+esc(r.date)+' · '+esc(r.time)+(r.operator?' · '+esc(r.operator):'')+'</div>'+vals+(attachmentsOf(r).length?attachmentButtons(r):'')+'</section>'});var html='<!doctype html><html lang="fr"><meta charset="utf-8"><title>Cahier sanitaire — Rapport</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#17212b}h1{margin-bottom:4px}section{border:1px solid #ccd6df;border-radius:8px;padding:12px;margin:14px 0;page-break-inside:avoid}.meta{color:#65727d;margin-bottom:8px}@media print{button{display:none}}</style><h1>Cahier sanitaire</h1><p>'+esc(config.name)+' · Exporté le '+esc(new Date().toLocaleString('fr-FR'))+'</p><button onclick="window.print()">🖨️ Imprimer / enregistrer en PDF</button>'+rows+'</html>';downloadBlob(new Blob([html],{type:'text/html;charset=utf-8'}),'cahier-sanitaire-'+actualToday()+'.html')}

/* Minimal XLSX writer: uncompressed ZIP + worksheet XML, fully offline. */
function crc32(s){var table=crc32.table||(crc32.table=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})());var c=0xffffffff;for(var i=0;i<s.length;i++)c=table[(c^s.charCodeAt(i))&255]^(c>>>8);return (c^0xffffffff)>>>0}
function u32(n){return String.fromCharCode(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255)}
function u16(n){return String.fromCharCode(n&255,(n>>>8)&255)}
function zipStore(files){var out='',central='',offset=0;files.forEach(function(f){var data=f.data,crc=crc32(data),name=f.name;out+='PK\x03\x04'+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u32(crc)+u32(data.length)+u32(data.length)+u16(name.length)+u16(0)+name+data;central+='PK\x01\x02'+u16(20)+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u32(crc)+u32(data.length)+u32(data.length)+u16(name.length)+u16(0)+u16(0)+u16(0)+u16(0)+u32(0)+u32(offset)+name;offset=out.length});out+=central+'PK\x05\x06'+u16(0)+u16(0)+u16(files.length)+u16(files.length)+u32(central.length)+u32(offset)+u16(0);return new Blob([new TextEncoder().encode(out)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xxml(s){return esc(s).replace(/&#39;/g,"'")}
function sheetXml(rows){var z='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';rows.forEach(function(row,i){z+='<row r="'+(i+1)+'">';row.forEach(function(v,j){var n=j+1,col='';while(n){var rem=(n-1)%26;col=String.fromCharCode(65+rem)+col;n=Math.floor((n-1)/26)}var val=v==null?'':(typeof v==='object'?JSON.stringify(v):String(v));z+='<c r="'+col+(i+1)+'" t="inlineStr"><is><t xml:space="preserve">'+xxml(val)+'</t></is></c>'});z+='</row>'});return z+'</sheetData></worksheet>'}
function excelSafe(v){if(v==null||v==='')return '';if(Array.isArray(v))return v.map(function(x){return typeof x==='object'?JSON.stringify(x):x}).join(' | ');if(typeof v==='object')return JSON.stringify(v);return String(v)}
function excelRowsFor(rlist){return rlist.map(function(r){var d=r.data||{};return [r.date||'',r.time||'',friendlyModule(r.module),r.operator||'',Object.keys(d).filter(function(k){return ['taskId','menuIndex','stepIndex','stepId','haccpStage'].indexOf(k)<0}).map(function(k){return friendlyField(k)+': '+excelSafe(d[k])}).join(' · ')]})}
function exportExcel(){var map=[['Synthèse',null],['Températures',['temperatures']],['Réceptions',['reception','deliveries']],['Cuissons',['cooking','menu_dish_control','menu_control']],['Mixés à chaud',['hotmix']],['Refroidissement',['cooling']],['Remise en température',['reheating']],['Distribution',['distribution']],['Excédents',['leftovers']],['Échantillons témoins',['samples']],['Nettoyage',['cleaning_session','cleaning_task']],['Traçabilité',['trace']],['Produits entamés',['opened']],['Décongélation',['thawing']],['Allergènes préparation',['allergenprep']],['Allergènes menus',['allergenmenu']],['Non-conformités',['nc']],['Maintenance',['maintenance']],['Matériel/inventaire',['inventory']],['Nuisibles',['pests']],['Déchets',['waste']],['Vérification des sondes',['probe']],['Vérification PMS',['pms']],['Formation',['training']],['Analyses/autocontrôles',['analyses']],['Archives/événements',['alert','tiac']]];
  var files=[],rels=[],sheetEntries=[];map.forEach(function(m,i){var rows=[[m[0],'Date','Heure','Rubrique','Opérateur','Détails']];if(m[1]){var rs=records.filter(function(r){return m[1].indexOf(r.module)>=0});rows=rows.concat(excelRowsFor(rs))}else rows=[[m[0],'Valeur'],['Établissement',config.name],['Exporté le',new Date().toLocaleString('fr-FR')],['Nombre total d’enregistrements',records.length]];var path='xl/worksheets/sheet'+(i+1)+'.xml';files.push({name:path,data:sheetXml(rows)});sheetEntries.push({name:m[0],id:i+1});});
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheetEntries.map(function(x){return '<sheet name="'+xxml(x.name).slice(0,31)+'" sheetId="'+x.id+'" r:id="rId'+x.id+'"/>'}).join('')+'</sheets></workbook>';
  files.push({name:'xl/workbook.xml',data:wb});files.push({name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheetEntries.map(function(x){return '<Relationship Id="rId'+x.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+x.id+'.xml"/>'}).join('')+'</Relationships>'});files.push({name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});files.push({name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="xml" ContentType="application/xml"/><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheetEntries.map(function(x){return '<Override PartName="/xl/worksheets/sheet'+x.id+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'}).join('')+'</Types>'});
  downloadBlob(zipStore(files),'cahier-sanitaire-'+actualToday()+'.xlsx');
}

function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('fr-FR')}setInterval(tick,1000);tick();home();
