function load(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x===null?clone(d):x}catch(e){return clone(d)}}function clone(x){return JSON.parse(JSON.stringify(x))}function save(){localStorage.setItem(CFG,JSON.stringify(config));localStorage.setItem(KEY,JSON.stringify(records))}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function localISO(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function actualToday(){return localISO(new Date())}function today(){return config.workDate||actualToday()}function now(){var real=new Date(),base=new Date(today()+'T00:00:00');base.setHours(real.getHours(),real.getMinutes(),real.getSeconds(),real.getMilliseconds());return {iso:today(),date:base.toLocaleDateString('fr-FR'),time:base.toLocaleTimeString('fr-FR'),stamp:real.toISOString()}}function setWorkDate(v){if(!v)return;config.workDate=v;save();home()}function isClosedDate(d){var dt=new Date(d+'T12:00:00'),wd=dt.getDay(),sc=config.schedule||{};return (sc.weekdays||[]).indexOf(wd)<0||(sc.closures||[]).indexOf(d)>=0||(sc.holidays||[]).indexOf(d)>=0}function workHoursLabel(){var h=config.scheduleHours||{};return h.enabled&&h.start&&h.end?' · Horaires : '+h.start+'–'+h.end:''} function mod(k){if(k==='menu_control')return ['menu_control','🍽️','Contrôle lié au menu','daily'];if(k==='menu_stage')return ['menu_stage','🍳','Étapes cuisson / maintien / service','daily'];if(k==='cleaning_session'||k==='cleaning_task')return [k,'🧽','Nettoyage / désinfection','daily'];if(k==='daily_tick')return ['daily_tick','☑️','Contrôles quotidiens','daily'];if(k==='menu_served')return ['menu_served','🍽️','Menu effectivement servi','daily'];return modules.find(function(m){return m[0]===k})||[k,'📋','Enregistrement','daily']}function page(title,body){var back=(window._lastPage&&window._lastPage!==title)?'window._returnPage()':'home()';window._currentPage=title;document.getElementById('app').innerHTML='<button class="back" onclick="'+back+'">← Retour</button><div class="card"><h2>'+title+'</h2>'+body+'</div>'}function opSelect(){var s='<label>Opérateur (facultatif)</label><select id="operator"><option value="">—</option>';config.operators.forEach(function(o){s+='<option>'+esc(o)+'</option>'});return s+'</select>'}
function attach(){return '<label>Photo / document (facultatif)</label><input id="file" type="file" accept="image/*,.pdf" capture="environment"><div class="muted">La photo est conservée comme pièce jointe. OCR non activé automatiquement.</div>'}function fileData(){var f=document.getElementById('file')?.files?.[0];if(!f)return Promise.resolve(null);if(f.size>3000000){alert('Fichier trop volumineux (maximum 3 Mo).');return Promise.resolve(null)}return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve({name:f.name,type:f.type,data:r.result})};r.readAsDataURL(f)})}
function readFiles(id,maxEach){var el=document.getElementById(id||'file'),fs=el&&el.files?Array.from(el.files):[];if(!fs.length)return Promise.resolve([]);maxEach=maxEach||5000000;for(var i=0;i<fs.length;i++){if(fs[i].size>maxEach){alert('Fichier trop volumineux : '+fs[i].name+' (maximum '+Math.round(maxEach/1000000)+' Mo).');return Promise.resolve(null)}}return Promise.all(fs.map(function(f){return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve({name:f.name,type:f.type,data:r.result})};r.readAsDataURL(f)})}))}function fileData(){return readFiles('file',5000000).then(function(a){return a&&a.length?a:null})}function attachmentsOf(r){if(!r)return [];if(Array.isArray(r.attachments))return r.attachments;if(r.attachment)return [r.attachment];return []}function addRecord(k,data){return fileData().then(function(a){var n=now();records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:k,createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:data.operator||'',data:data,attachment:null,attachments:a||[],corrections:[]});save();home()})}

{id:'waste',icon:'🗑️',title:'Déchets — fin de service',sub:'Évacuation / maîtrise des déchets selon le PMS'}
];

function cleaningDueToday(task){
var d=today(),dt=new Date(d+'T12:00:00'),wd=dt.getDay();
if(!task.active)return false;
if(task.startDate&&d<task.startDate)return false;
if(task.endDate&&d>task.endDate)return false;
var freq=task.frequency||'daily';
if(freq==='daily')return true;
if(freq==='weekly')return (task.weekdays||[]).indexOf(wd)>=0;
if(freq==='biweekly'){
  if((task.weekdays||[]).indexOf(wd)<0)return false;
  var base=task.startDate||d,bd=new Date(base+'T12:00:00'),diff=Math.floor((dt-bd)/86400000);
  return diff>=0 && Math.floor(diff/7)%2===0;
}
if(freq==='monthly')return dt.getDate()===Number(task.dayOfMonth||1);
if(freq==='interval'){
  var base2=task.startDate||d,bd2=new Date(base2+'T12:00:00'),diff2=Math.floor((dt-bd2)/86400000),n=Number(task.intervalDays||14);
  return diff2>=0 && diff2%n===0;
}
return false;
}

function finishCleaning(status){
  var tasks=cleaningTodayTasks(), done=cleaningDailyRecords();
  if(!tasks.length){ alert('Aucune tâche de nettoyage prévue aujourd’hui.'); return false; }
  var completedIds={};
  done.forEach(function(r){if(r.data&&r.data.taskId)completedIds[r.data.taskId]=true;});
  if(status==='completed'){
    tasks.forEach(function(t){
      if(!completedIds[t.id]){
        var tn=now(), td={taskId:t.id,task:t.name,operation:t.operation||'Nettoyage / désinfection',operator:''};
        records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random(),module:'cleaning_task',createdAt:tn.stamp,iso:tn.iso,date:tn.date,time:tn.time,operator:'',data:td,attachment:null,corrections:[]});
      }
    });
    completedIds={};
    cleaningDailyRecords().forEach(function(r){if(r.data&&r.data.taskId)completedIds[r.data.taskId]=true;});
  }
  var completed=tasks.filter(function(t){return !!completedIds[t.id];}).length;
  var already=cleaningDailyRecords().find(function(r){return r.data&&r.data.sessionStatus;});
  var n=now(), d={sessionStatus:status,completedCount:completed,totalCount:tasks.length,summary:status==='completed'?'Tous les éléments terminés':'Nettoyage arrêté avant la fin'};
  if(already){
    var old=clone(already.data||{});
    already.data=d; already.date=n.date; already.time=n.time; already.iso=n.iso; already.createdAt=n.stamp;
    already.corrections=already.corrections||[];
    already.corrections.push({date:n.date,time:n.time,timestamp:n.stamp,field:'sessionStatus',oldValue:old.sessionStatus||'',newValue:status,reason:'Mise à jour de la fin du nettoyage',operator:''});
  }else{
    records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random(),module:'cleaning_session',createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:'',data:d,attachment:null,corrections:[]});
  }
  try{save();}catch(e){alert('Impossible d’enregistrer le nettoyage. Vérifiez l’espace de stockage du navigateur.');return false;}
  home();
  return true;
}

function saveWorkflowControl(taskId,mi,si){var menu=(config.menus&&config.menus[today()])||[],x=menu[mi];if(!x)return;var p=prepProfile(x.name,x.type),st=ensureWorkflow(p)[si];if(!st)return;var n=now(),data={taskId:taskId,menuIndex:mi,stepIndex:si,stepId:st.id||String(si),preparation:x.name,haccpStage:st.type,label:st.label||workflowTypes[st.type]||'Contrôle',operator:document.getElementById('operator')?.value||''};['wfTemp','wfEquip','wfStart','wfEnd','wfDuration','wfObs','wfServiceTime'].forEach(function(id){var e=document.getElementById(id);if(e&&String(e.value).trim()!=='')data[id]=e.value});var chosen=document.getElementById('wfObs')?.value;if(chosen)data.observation=chosen;var free=document.getElementById('wfObsfree')?.value.trim();if(free)data.observation=(data.observation?data.observation+' — ':'')+free;records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:'menu_control',createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:data.operator,data:data,attachment:null,corrections:[]});save();home()}

function quickDaily(id){if(id==='fridge_open'||id==='fridge_mid'){fridgeDailyPage(id);return}if(id==='samples'){samplesDailyPage();return}if(id==='cleaning_end'){cleaningDailyPage();return}if(id==='menu_served'){menuServedPage();return}var label=id==='waste'?'Déchets — fin de service':'Contrôle effectué';var h=opSelect()+standardObservation('qdObs','conforme')+'<label>Observation libre (facultatif)</label><textarea id="qdObsfree" placeholder="Seulement si nécessaire"></textarea><button class="save" onclick="saveQuickStandard(\''+id+'\')">✓ Enregistrer</button>';page('☑️ '+label,h)}
function menuServedPage(){var menu=(config.menus&&config.menus[today()])||[];if(!menu.length){alert('Introduisez d’abord le menu du jour.');return}var existing=records.filter(function(r){return r.module==='menu_served'&&r.iso===today()&&!r.data?.cancelled}).slice(-1)[0],served=existing?.data?.items||menu.map(function(x){return {name:x.name,status:'Servi'}}),h=opSelect()+'<div class="notice">Choisissez le menu réellement servi. Les remplacements et absences sont enregistrés sans effacer le menu prévu.</div>';menu.forEach(function(x,i){var sv=served[i]||x;h+='<div class="rule"><b>'+esc(x.slot)+'</b><label>Préparation</label><input class="servedName" value="'+esc(sv.name||'')+'"><label>Statut</label>'+choiceButtons('servedStatus'+i,['Servi','Remplacé','Non servi'])+'</div>'});h+='<label>📷 Photo / justificatif (facultatif)</label><input id="servedFile" type="file" accept="image/*,.pdf" capture="environment" multiple><label>Observation libre (facultatif)</label><textarea id="servedObs"></textarea><button class="save" onclick="saveMenuServed()">✓ Enregistrer</button>';if(existing)h+='<div class="record"><b>Dernier enregistrement</b> · '+esc(existing.time)+' <button class="smallbtn" onclick="correct(\''+existing.id+'\')">✏️ Corriger</button></div>';page('🍽️ Menu effectivement servi',h)}
function saveMenuServed(){var menu=(config.menus&&config.menus[today()])||[],names=[].slice.call(document.querySelectorAll('.servedName')),items=names.map(function(e,i){return {slot:menu[i]?.slot||'',name:e.value.trim(),status:document.getElementById('servedStatus'+i)?.value||'Servi'}});readFiles('servedFile',5000000).then(function(atts){if(atts===null)return;var n=now(),d={items:items,menuDate:today(),observation:document.getElementById('servedObs')?.value||'',conforme:true,operator:document.getElementById('operator')?.value||''};records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:'menu_served',createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:d.operator,data:d,attachment:null,attachments:atts||[],corrections:[]});save();home()})}
function saveQuickStandard(id,label){label=label||(id==='waste'?'Déchets — fin de service':'Contrôle effectué');var n=now(),obs=document.getElementById('qdObs')?.value||'',free=document.getElementById('qdObsfree')?.value||'';var d={taskId:id,label:label,check:obs||'Conforme',observation:free,operator:document.getElementById('operator')?.value||''};records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:'daily_tick',createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:d.operator,data:d,attachment:null,corrections:[]});save();home()}

function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('fr-FR')}setInterval(tick,1000);tick();home();
