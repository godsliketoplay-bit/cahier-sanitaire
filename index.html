function load(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x===null?clone(d):x}catch(e){return clone(d)}}function clone(x){return JSON.parse(JSON.stringify(x))}function save(){localStorage.setItem(CFG,JSON.stringify(config));localStorage.setItem(KEY,JSON.stringify(records))}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function localISO(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function actualToday(){return localISO(new Date())}function today(){return config.workDate||actualToday()}function now(){var real=new Date(),base=new Date(today()+'T00:00:00');base.setHours(real.getHours(),real.getMinutes(),real.getSeconds(),real.getMilliseconds());return {iso:today(),date:base.toLocaleDateString('fr-FR'),time:base.toLocaleTimeString('fr-FR'),stamp:real.toISOString()}}function setWorkDate(v){if(!v)return;config.workDate=v;save();home()}function isClosedDate(d){var dt=new Date(d+'T12:00:00'),wd=dt.getDay(),sc=config.schedule||{};return (sc.weekdays||[]).indexOf(wd)<0||(sc.closures||[]).indexOf(d)>=0||(sc.holidays||[]).indexOf(d)>=0}function workHoursLabel(){var h=config.scheduleHours||{};return h.enabled&&h.start&&h.end?' · Horaires : '+h.start+'–'+h.end:''} function mod(k){if(k==='menu_control')return ['menu_control','🍽️','Contrôle lié au menu','daily'];if(k==='menu_stage')return ['menu_stage','🍳','Étapes cuisson / maintien / service','daily'];if(k==='daily_tick')return ['daily_tick','☑️','Contrôles quotidiens','daily'];return modules.find(function(m){return m[0]===k})||[k,'📋',k,'daily']}function page(title,body){document.getElementById('app').innerHTML='<button class="back" onclick="home()">← Accueil</button><div class="card"><h2>'+title+'</h2>'+body+'</div>'}function opSelect(){var s='<label>Opérateur (facultatif)</label><select id="operator"><option value="">—</option>';config.operators.forEach(function(o){s+='<option>'+esc(o)+'</option>'});return s+'</select>'}
function attach(){return '<label>Photo / document (facultatif)</label><input id="file" type="file" accept="image/*,.pdf" capture="environment"><div class="muted">La photo est conservée comme pièce jointe. OCR non activé automatiquement.</div>'}function fileData(){var f=document.getElementById('file')?.files?.[0];if(!f)return Promise.resolve(null);if(f.size>3000000){alert('Fichier trop volumineux (maximum 3 Mo).');return Promise.resolve(null)}return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve({name:f.name,type:f.type,data:r.result})};r.readAsDataURL(f)})}

var d=today(), menu=(config.menus&&config.menus[d])||[];
var custom=customDailyTasks();

var daily=[
{id:'fridge_open',icon:'🌡️',title:'Températures froid — arrivée / matin',sub:'Contrôler tous les réfrigérateurs et congélateurs configurés'},

];

h+='</div>';

var tasks=buildMenuTasks(menu);h+='<div class="card"><h2>🍳 Contrôles du menu</h2>';
if(tasks.length){tasks.forEach(function(t){var done=menuTaskDone(t);h+='<div class="task"><div class="task-main"><b>'+t.icon+' '+esc(t.title)+'</b><div class="muted">'+esc(t.subtitle)+(done?' · <span class="doneText">✓ FAIT</span>':'')+'</div></div><div class="task-actions">'+(done?'<button class="tap" onclick="menuTaskPage(\''+t.id+'\')">👁 Voir</button><button class="tap" onclick="menuTaskCorrect(\''+t.id+'\')">✏️ Corriger</button>':'<button class="tap" onclick="menuTaskPage(\''+t.id+'\')">✓ FAIRE</button>')+'</div></div>'})}
else h+='<div class="muted">Introduisez le menu pour générer les contrôles.</div>';h+='</div>';

var occ=modules.filter(function(m){return m[3]==='daily'&&config.modules[m[0]]==='OCCASIONNEL'&&m[0]!=='nc'});if(occ.length){h+='<div class="card"><h3>Occasionnel</h3>';occ.forEach(function(m){h+='<div class="task"><div class="task-main"><b>'+m[1]+' '+m[2]+'</b></div><button class="tap" onclick="formPage(\''+m[0]+'\')">Ouvrir</button></div>'});h+='</div>'}
var ncEnabled=config.modules.nc!=='NON APPLICABLE';if(ncEnabled){h+='<div class="card"><h3>⚠️ Événement</h3><div class="task"><div class="task-main"><b>Non-conformité</b><div class="muted">Uniquement lorsqu’un problème survient — pas de contrôle quotidien</div></div><button class="tap" onclick="formPage(\'nc\')">Ouvrir</button></div></div>'}var per=modules.filter(function(m){return m[3]==='periodic'&&config.modules[m[0]]!=='NON APPLICABLE'});h+='<div class="card"><h3>Contrôles périodiques</h3>';per.forEach(function(m){h+='<div class="task"><div class="task-main"><b>'+m[1]+' '+m[2]+'</b></div><button class="tap" onclick="formPage(\''+m[0]+'\')">Ouvrir</button></div>'});h+='</div>';

function cleaningDueToday(task){

function removeIngredient(i){if(!confirm('Supprimer cet ingrédient des paramètres ?'))return;config.ingredients.splice(i,1);save();settings()}
