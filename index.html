function load(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x===null?clone(d):x}catch(e){return clone(d)}}function clone(x){return JSON.parse(JSON.stringify(x))}function save(){localStorage.setItem(CFG,JSON.stringify(config));localStorage.setItem(KEY,JSON.stringify(records))}function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function localISO(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function now(){var d=new Date();return {iso:localISO(d),date:d.toLocaleDateString('fr-FR'),time:d.toLocaleTimeString('fr-FR'),stamp:d.toISOString()}}function today(){return localISO(new Date())}function mod(k){if(k==='menu_control')return ['menu_control','🍽️','Contrôle lié au menu','daily'];if(k==='menu_stage')return ['menu_stage','🍳','Étapes cuisson / maintien / service','daily'];if(k==='daily_tick')return ['daily_tick','☑️','Contrôles quotidiens','daily'];return modules.find(function(m){return m[0]===k})||[k,'📋',k,'daily']}function page(title,body){document.getElementById('app').innerHTML='<button class="back" onclick="home()">← Accueil</button><div class="card"><h2>'+title+'</h2>'+body+'</div>'}function opSelect(){var s='<label>Opérateur (facultatif)</label><select id="operator"><option value="">—</option>';config.operators.forEach(function(o){s+='<option>'+esc(o)+'</option>'});return s+'</select>'}
function attach(){return '<label>Photo / document (facultatif)</label><input id="file" type="file" accept="image/*,.pdf" capture="environment"><div class="muted">La photo est conservée comme pièce jointe. OCR non activé automatiquement.</div>'}function fileData(){var f=document.getElementById('file')?.files?.[0];if(!f)return Promise.resolve(null);if(f.size>3000000){alert('Fichier trop volumineux (maximum 3 Mo).');return Promise.resolve(null)}return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve({name:f.name,type:f.type,data:r.result})};r.readAsDataURL(f)})}
function addRecord(k,data){return fileData().then(function(a){var n=now();records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:k,createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:data.operator||'',data:data,attachment:a,corrections:[]});save();home()})}
function isOpenDay(d){return true}
function home(){
var d=today(), menu=(config.menus&&config.menus[d])||[];
var h='<div class="card"><b>'+esc(config.name)+'</b><div class="muted">Aujourd’hui · '+new Date().toLocaleDateString('fr-FR')+' · date et heure enregistrées automatiquement</div>';h+='<div class="menuQuick"><button type="button" onclick="historyPage()">📚 Historique ('+records.length+')</button><button type="button" onclick="backupPage()">💾 Sauvegarder</button></div>';

h+='<h2>🍽️ Menu du jour</h2>';
if(menu.length){menu.forEach(function(x){h+='<div class="task"><div class="task-main"><b>'+esc(x.name)+'</b><div class="muted">'+esc(menuTypeLabel(x.type))+'</div></div></div>'})}
else h+='<div class="notice">Commencez par introduire le menu. Le menu détermine les contrôles nécessaires.</div>';
h+='<div class="menuQuick"><button type="button" onclick="menuPage()">'+(menu.length?'✏️ Modifier le menu':'＋ Introduire le menu')+'</button>'+(config.lastMenu&&config.lastMenu.length?'<button type="button" onclick="reuseLastMenu()">↻ Reprendre le dernier menu</button>':'')+'</div></div>';

h+='<div class="card"><h2>☑️ À faire aujourd’hui</h2><div class="muted">La plupart des contrôles sont un simple ✓. La date et l’heure sont prises au moment du contrôle. Une température est demandée uniquement lorsqu’une mesure est nécessaire.</div>';
var daily=[
{id:'fridge_open',icon:'🌡️',title:'Températures froid — arrivée / matin',sub:'Contrôler tous les réfrigérateurs et congélateurs configurés'},
{id:'fridge_mid',icon:'🌡️',title:'Températures froid — midi',sub:'Contrôler tous les réfrigérateurs et congélateurs configurés'},
{id:'cleaning_end',icon:'🧽',title:'Nettoyage / désinfection',sub:'Tâches prévues aujourd’hui'},
{id:'samples',icon:'🧪',title:'Plats témoins — service du jour',sub:'Sélectionner les plats effectivement distribués puis enregistrer le prélèvement'},
{id:'menu_served',icon:'🍽️',title:'Menu effectivement servi',sub:'Valider le menu réellement distribué — modifications conservées dans la traçabilité'},
{id:'waste',icon:'🗑️',title:'Déchets — fin de service',sub:'Évacuation / maîtrise des déchets selon le PMS'}
];
daily.forEach(function(t){var rec=dailyRecord(t.id,d);h+='<div class="task"><div class="task-main"><b>'+t.icon+' '+t.title+'</b><div class="muted">'+t.sub+(rec?' · <span class="doneText">✓ FAIT · '+esc(rec.time)+'</span>':'')+'</div></div><div class="task-actions">'+(rec?'<button class="tap" onclick="viewRecord(\''+rec.id+'\')">👁 Voir</button><button class="tap" onclick="correct(\''+rec.id+'\')">✏️ Corriger</button>':'<button class="tap" onclick="quickDaily(\''+t.id+'\')">✓ FAIRE</button>')+'</div></div>'});
h+='</div>';

var tasks=buildMenuTasks(menu);h+='<div class="card"><h2>🍳 Contrôles du menu</h2>';
if(tasks.length){tasks.forEach(function(t){var done=menuTaskDone(t);h+='<div class="task"><div class="task-main"><b>'+t.icon+' '+esc(t.title)+'</b><div class="muted">'+esc(t.subtitle)+(done?' · <span class="doneText">✓ FAIT</span>':'')+'</div></div><div class="task-actions">'+(done?'<button class="tap" onclick="menuTaskPage(\''+t.id+'\')">👁 Voir</button><button class="tap" onclick="menuTaskCorrect(\''+t.id+'\')">✏️ Corriger</button>':'<button class="tap" onclick="menuTaskPage(\''+t.id+'\')">✓ FAIRE</button>')+'</div></div>'})}
else h+='<div class="muted">Introduisez le menu pour générer les contrôles.</div>';h+='</div>';

var occ=modules.filter(function(m){return m[3]==='daily'&&config.modules[m[0]]==='OCCASIONNEL'&&m[0]!=='nc'});if(occ.length){h+='<div class="card"><h3>Occasionnel</h3>';occ.forEach(function(m){h+='<div class="task"><div class="task-main"><b>'+m[1]+' '+m[2]+'</b></div><button class="tap" onclick="formPage(\''+m[0]+'\')">Ouvrir</button></div>'});h+='</div>'}
var ncEnabled=config.modules.nc!=='NON APPLICABLE';if(ncEnabled){h+='<div class="card"><h3>⚠️ Événement</h3><div class="task"><div class="task-main"><b>Non-conformité</b><div class="muted">Uniquement lorsqu’un problème survient — pas de contrôle quotidien</div></div><button class="tap" onclick="formPage(\'nc\')">Ouvrir</button></div></div>'}var per=modules.filter(function(m){return m[3]==='periodic'&&config.modules[m[0]]!=='NON APPLICABLE'});h+='<div class="card"><h3>Contrôles périodiques</h3>';per.forEach(function(m){h+='<div class="task"><div class="task-main"><b>'+m[1]+' '+m[2]+'</b></div><button class="tap" onclick="formPage(\''+m[0]+'\')">Ouvrir</button></div>'});h+='</div>';
h+='<div class="grid"><button class="tile" onclick="sourcesPage()"><b>📚</b>Sources & légal</button><button class="tile" onclick="historyPage()"><b>📊</b>Historique / Excel</button><button class="tile" onclick="settings()"><b>⚙️</b>Paramètres</button><button class="tile" onclick="backupPage()"><b>💾</b>Sauvegarde</button><button class="tile" onclick="correctionHistory()"><b>✏️</b>Corrections</button></div>';
document.getElementById('app').innerHTML=h}

function dailyRecord(id,d){return records.filter(function(r){return r.module==='daily_tick'&&r.iso===d&&r.data&&r.data.taskId===id}).sort(function(a,b){return b.createdAt.localeCompare(a.createdAt)})[0]||null}
function quickDaily(id){
if(id==='fridge_open'||id==='fridge_mid'){fridgeDailyPage(id);return}
if(id==='samples'){samplesDailyPage();return}
if(id==='cleaning_end'){cleaningDailyPage();return}
var d={taskId:id,operator:'',conforme:true};
if(id==='cleaning_end'){d.label='Nettoyage / désinfection — fin de service';d.check='Effectué'}
if(id==='menu_served'){d.label='Menu effectivement servi';d.check='Effectué';d.menu=(config.menus&&config.menus[today()])||[]}
if(id==='waste'){d.label='Déchets — fin de service';d.check='Effectué'}
var n=now();records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:'daily_tick',createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:'',data:d,attachment:null,corrections:[]});save();home()}
function reuseLastMenu(){var last=config.lastMenu||[];if(!last.length)return;config.menus=config.menus||{};config.menus[today()]=clone(last);save();home()}

function cleaningDueToday(task){
var d=today(),dt=new Date(d+'T12:00:00'),wd=dt.getDay();
if(!task.active)return false;
if(task.startDate&&d<task.startDate)return false;
if(task.endDate&&d>task.endDate)return false;
var freq=task.frequency||'daily';
if(freq==='daily')return true;
if(freq==='weekly')return (task.weekdays||[]).indexOf(wd)>=0;
if(freq==='biweekly'){
  if((task.weekdays||[]).indexOf(wd)<0)return false;
  var base=task.startDate||d,bd=new Date(base+'T12:00:00'),diff=Math.floor((dt-bd)/86400000);
  return diff>=0 && Math.floor(diff/7)%2===0;
}
if(freq==='monthly')return dt.getDate()===Number(task.dayOfMonth||1);
if(freq==='interval'){
  var base2=task.startDate||d,bd2=new Date(base2+'T12:00:00'),diff2=Math.floor((dt-bd2)/86400000),n=Number(task.intervalDays||14);
  return diff2>=0 && diff2%n===0;
}
return false;
}
function cleaningTodayTasks(){return (config.cleaningPlan||[]).filter(cleaningDueToday)}
function cleaningDailyRecords(){return records.filter(function(r){return r.module==='cleaning_task'&&r.iso===today()})}
function cleaningDailyPage(){
var tasks=cleaningTodayTasks(),done=cleaningDailyRecords(),doneIds={};done.forEach(function(r){doneIds[r.data.taskId]=r});
var h='<div class="notice"><b>Plan de nettoyage du jour</b><br>Les tâches sont générées automatiquement selon le planning configuré. Cochez simplement ce qui est fait. Date et heure automatiques.</div>';
if(!tasks.length)h+='<div class="muted">Aucune tâche de nettoyage prévue aujourd’hui.</div>';
tasks.forEach(function(t){var r=doneIds[t.id];h+='<div class="task"><div class="task-main"><b>🧽 '+esc(t.name)+'</b><div class="muted">'+esc(t.operation||'Nettoyage / désinfection')+(r?' · <span class="doneText">✓ FAIT · '+esc(r.time)+'</span>':'')+'</div></div><div class="task-actions">'+(r?'<button class="tap" onclick="viewRecord(\''+r.id+'\')">👁 Voir</button><button class="tap" onclick="correct(\''+r.id+'\')">✏️ Corriger</button>':'<button class="tap" onclick="completeCleaning(\''+t.id+'\')">✓ FAIT</button>')+'</div></div>'});
if(tasks.length&&tasks.every(function(t){return !!doneIds[t.id]}))h+='<div class="notice" style="margin-top:12px">🟢 <b>Nettoyage du jour terminé.</b></div>';
page('🧽 Nettoyage / désinfection',h)
}
function completeCleaning(id){var t=(config.cleaningPlan||[]).find(function(x){return x.id===id});if(!t)return;var n=now(),d={taskId:id,task:t.name,operation:t.operation||'Nettoyage / désinfection',operator:''};records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),module:'cleaning_task',createdAt:n.stamp,iso:n.iso,date:n.date,time:n.time,operator:'',data:d,attachment:null,corrections:[]});save();cleaningDailyPage()}
function addCleaningTask(){
var name=prompt('Nom de la tâche :','Plans de travail');if(name===null||!name.trim())return;
var operation=prompt('Opération :','Nettoyage et désinfection');if(operation===null)operation='Nettoyage et désinfection';
var frequency=prompt('Fréquence : daily / weekly / biweekly / monthly / interval','daily');if(!['daily','weekly','biweekly','monthly','interval'].includes(frequency))frequency='daily';
var t={id:'cl'+Date.now(),name:name.trim(),operation:operation.trim(),frequency:frequency,weekdays:frequency==='weekly'||frequency==='biweekly'?[1,2,4,5]:[],startDate:today(),dayOfMonth:1,intervalDays:14,active:true};config.cleaningPlan.push(t);save();settings()}
function removeCleaningTask(i){if(!confirm('Supprimer cette tâche du plan de nettoyage ?'))return;config.cleaningPlan.splice(i,1);save();settings()}
function toggleCleaningTask(i){config.cleaningPlan[i].active=!config.cleaningPlan[i].active;save();settings()}

function deleteRule(i){if(!confirm('Supprimer ce paramètre ?'))return;config.rules.splice(i,1);save();settings()}
function saveSettings(){config.name=document.getElementById('cfgname').value.trim()||'Cantine scolaire';config.operators=document.getElementById('ops').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);config.equipment=(config.equipment||[]).filter(Boolean);save();var b=document.querySelector('.save');if(b){b.textContent='✓ Enregistré';setTimeout(function(){b.textContent='💾 Enregistrer les paramètres'},1200)}}
function addEquipmentPreset(base){config.equipment=config.equipment||[];var n=1,name=base+' '+n;while(config.equipment.indexOf(name)>=0){n++;name=base+' '+n}config.equipment.push(name);save();settings()}
function addEquipmentCustom(){var e=document.getElementById('newEquipment'),v=e?e.value.trim():'';if(!v)return;config.equipment=config.equipment||[];if(config.equipment.indexOf(v)<0)config.equipment.push(v);save();settings()}
function removeEquipment(i){if(!confirm('Supprimer cet équipement des paramètres ?'))return;config.equipment.splice(i,1);save();settings()}
function backupData(){return JSON.stringify({version:15,savedAt:new Date().toISOString(),config:config,records:records},null,2)}
function setSaveStatus(t){var el=document.getElementById('saveStatus');if(el){el.textContent=t;el.style.display='block'}}
function saveBackupToPhone(){var blob=new Blob([backupData()],{type:'application/json'}),name='cahier-sanitaire-backup-'+today()+'.json';if(navigator.share){try{var file=new File([blob],name,{type:'application/json'});if(!navigator.canShare||navigator.canShare({files:[file]})){navigator.share({title:'Sauvegarde Cahier sanitaire',text:'Enregistrer cette sauvegarde dans Fichiers, Téléchargements ou Drive.',files:[file]}).then(function(){setSaveStatus('✓ Sauvegarde envoyée au menu de partage. Choisissez où la conserver.');}).catch(function(){download(blob,name);setSaveStatus('✓ Fichier téléchargé dans Téléchargements.');});return}}catch(e){}}download(blob,name);setSaveStatus('✓ Fichier téléchargé dans Téléchargements.')}
function backupPage(){page('💾 Sauvegarde','<div class=\"notice\"><b>La sauvegarde crée un vrai fichier .json avec votre cahier et vos paramètres.</b><br>Sur Android, utilisez le menu de partage pour choisir <b>Fichiers</b>, <b>Téléchargements</b> ou <b>Drive</b>.</div><button class=\"save\" onclick=\"saveBackupToPhone()\">💾 Enregistrer la sauvegarde</button><div id=\"saveStatus\" class=\"notice\" style=\"display:none;margin-top:10px\"></div><hr><label>♻️ Restaurer une sauvegarde</label><input id=\"restore\" type=\"file\" accept=\"application/json,.json\"><button class=\"save\" onclick=\"restoreBackup()\">♻️ Restaurer</button>')}
function restoreBackup(){var f=document.getElementById('restore').files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.config||!x.records)throw Error();config=x.config;records=x.records;save();home()}catch(e){alert('Sauvegarde invalide.')}};r.readAsText(f)}function download(blob,name){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);try{a.click()}finally{setTimeout(function(){a.remove();URL.revokeObjectURL(url)},1500)}}
